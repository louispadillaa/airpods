<section class="relative border-t border-line py-28">
  <div class="mx-auto max-w-7xl px-6 lg:px-10">
    <div class="max-w-xl" appReveal>
      <p class="eyebrow">Field notes</p>
      <h2 class="mt-4 font-display text-4xl font-semibold tracking-tightest text-porcelain sm:text-5xl">
        Worn, not just reviewed.
      </h2>
    </div>

    <div class="mt-16 grid grid-cols-1 gap-6 md:grid-cols-3">
      <article
        *ngFor="let review of reviews; let i = index"
        appReveal
        [revealDelay]="i * 130"
        class="flex flex-col justify-between rounded-3xl border border-line bg-void-panel p-8 transition-transform duration-500 hover:-translate-y-1.5"
      >
        <div>
          <div class="flex gap-1">
            <svg *ngFor="let filled of stars(review.rating)" width="14" height="14" viewBox="0 0 24 24" [attr.fill]="filled ? '#7DF9FF' : 'none'" [attr.stroke]="filled ? '#7DF9FF' : '#2A2A2E'" stroke-width="1.5">
              <path d="M12 3.5 14.6 9l6.1.9-4.4 4.3 1 6-5.3-2.8-5.3 2.8 1-6-4.4-4.3 6.1-.9L12 3.5Z" />
            </svg>
          </div>
          <p class="mt-6 font-body text-[15px] leading-relaxed text-porcelain/90">“{{ review.quote }}”</p>
        </div>

        <div class="mt-8 flex items-center gap-3 border-t border-line pt-5">
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-void-raised font-display text-xs text-porcelain">
            {{ review.name.charAt(0) }}
          </div>
          <div>
            <p class="font-body text-sm text-porcelain">{{ review.name }}</p>
            <p class="font-mono text-[11px] uppercase tracking-wide text-mist">{{ review.role }}</p>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
