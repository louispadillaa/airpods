<section class="relative border-t border-line bg-void-panel py-28">
  <div class="mx-auto max-w-7xl px-6 lg:px-10">
    <div class="grid grid-cols-1 gap-16 lg:grid-cols-2 lg:gap-24">
      <!-- spec sheet -->
      <div appReveal>
        <p class="eyebrow">Under the hood</p>
        <h2 class="mt-4 font-display text-4xl font-semibold tracking-tightest text-porcelain sm:text-5xl">
          The numbers, plainly.
        </h2>

        <dl class="mt-12 divide-y divide-line border-t border-line">
          <div *ngFor="let spec of specs" class="flex items-center justify-between py-4">
            <dt class="font-mono text-xs uppercase tracking-widest2 text-mist">{{ spec.label }}</dt>
            <dd class="font-body text-sm text-porcelain">{{ spec.value }}</dd>
          </div>
        </dl>
      </div>

      <!-- comparisons -->
      <div appReveal [revealDelay]="150">
        <p class="eyebrow">Pulse Air vs. standard buds</p>
        <h2 class="mt-4 font-display text-2xl font-medium text-porcelain">Measured, not marketed.</h2>

        <div class="mt-12 flex flex-col gap-10">
          <div *ngFor="let item of comparisons">
            <div class="flex items-baseline justify-between">
              <span class="font-body text-sm text-porcelain">{{ item.label }}</span>
              <span class="font-mono text-xs text-mist">{{ item.unit }}</span>
            </div>

            <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-void-raised">
              <div
                appReveal
                class="bar-fill h-full rounded-full bg-ripple"
                [style.--target-width.%]="item.pulsePct"
              ></div>
            </div>
            <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-void-raised">
              <div
                appReveal
                [revealDelay]="120"
                class="bar-fill h-full rounded-full bg-line"
                [style.--target-width.%]="item.standardPct"
              ></div>
            </div>
          </div>
        </div>

        <div class="mt-8 flex items-center gap-6 font-mono text-[11px] uppercase tracking-wide text-mist">
          <span class="flex items-center gap-2"><span class="h-1.5 w-4 rounded-full bg-ripple"></span>Pulse Air</span>
          <span class="flex items-center gap-2"><span class="h-1.5 w-4 rounded-full bg-line"></span>Standard buds</span>
        </div>
      </div>
    </div>
  </div>
</section>
